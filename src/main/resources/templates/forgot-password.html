<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<h2>Forgot Password</h2>
<form th:action="@{/reset-password}" method="post">
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </div>
    <div>
        <label for="verificationCode">Verification Code:</label>
        <input type="text" id="verificationCode" name="verificationCode" required>
    </div>
    <div>
        <label for="newPassword">New Password:</label>
        <input type="password" id="newPassword" name="newPassword" required>
    </div>
    <div>
        <button type="submit">Reset Password</button>
    </div>
</form>
<button onclick="sendVerificationCode()">Send Verification Code</button>
<br>
<a th:href="@{/login}">Back to Login</a>

<script th:inline="javascript">
    function sendVerificationCode() {
        // Get the email input field value
        var email = document.getElementById('email').value;

        // Get the CSRF token from the hidden meta tag
        var csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        var csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        // Use fetch to send the POST request, including the CSRF token
        fetch('/send-verification?email=' + email, {
            method: 'POST',
            headers: {
                [csrfHeader]: csrfToken, // Adding the CSRF token to the request header
                'Content-Type': 'application/json'
            }
        })
            .then(response => {
                if (response.ok) {
                    alert('Verification code sent!');
                } else {
                    alert('Failed to send verification code');
                }
            });
    }
</script>
</body>
</html>
